<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07152E">
<title>ARENA | HOTEL — волонтёры ЧМ по борьбе</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --deep:#07152E; --navy:#10254A; --navy2:#0C1D3B; --accent:#397BFF; --accent2:#2A64E0;
  --white:#FFFFFF; --text2:#A9BAD4; --text3:#7A8FB1; --line:rgba(169,186,212,.14); --line2:rgba(169,186,212,.26);
  --ok:#22C55E; --warn:#F59E0B; --err:#EF4444;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--deep)}
body{font-family:'Manrope',system-ui,-apple-system,sans-serif;color:var(--white);-webkit-font-smoothing:antialiased}
button,input,textarea{font-family:inherit;color:inherit}
#app{position:relative;display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:560px;margin:0 auto;
  background:radial-gradient(120% 60% at 100% 0%,rgba(57,123,255,.16),transparent 60%),radial-gradient(90% 50% at 0% 100%,rgba(57,123,255,.08),transparent 60%),var(--deep)}
.hdr{flex:none;padding:8px 16px 14px;background:rgba(7,21,46,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px;z-index:2}
.hdr-row{display:flex;align-items:center;gap:6px;min-height:44px}
.hdr-title{flex:1;font-weight:800;font-size:15px;letter-spacing:.02em}
.step{font-size:12px;font-weight:800;color:#CFE0FF;background:rgba(57,123,255,.18);padding:5px 10px;border-radius:999px}
.segs{display:flex;gap:6px}
.seg{flex:1;height:4px;border-radius:2px;background:rgba(169,186,212,.16);overflow:hidden}
.seg i{display:block;height:100%;width:0;background:linear-gradient(90deg,#5B93FF,var(--accent));transition:width .35s ease}
.seg.on i{width:100%}
main{flex:1;overflow-y:auto;padding:22px 16px 28px;display:flex;flex-direction:column;gap:20px;-webkit-overflow-scrolling:touch}
main.anim{animation:in .32s ease both}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ftr{flex:none;padding:12px 16px calc(16px + env(safe-area-inset-bottom));background:rgba(7,21,46,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px;z-index:2}
.ftr-row{display:flex;gap:10px}
h1{margin:0;font-size:26px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.h1-big{font-size:31px;line-height:1.15}
.h2{margin:0;font-size:17px;font-weight:800;line-height:1.3}
.sub{margin:8px 0 0;font-size:15px;line-height:1.5;color:var(--text2)}
.muted{color:var(--text2)}
.small{font-size:13px;font-weight:600;line-height:1.45}
.col{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.g4{gap:4px}.g6{gap:6px}.g8{gap:8px}.g10{gap:10px}.g12{gap:12px}.g14{gap:14px}.g16{gap:16px}.g18{gap:18px}
.lbl{font-size:14px;font-weight:700;color:#DCE6F5}
.req{color:#FF8A8A}
.inp{display:block;width:100%;height:54px;border:1.5px solid var(--line2);border-radius:14px;padding:0 15px;font-size:16px;background:rgba(5,15,34,.55);outline:none;transition:border-color .15s,box-shadow .15s;-webkit-appearance:none}
.inp::placeholder{color:#5F7397}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(57,123,255,.25)}
.inp.bad{border-color:var(--err);box-shadow:0 0 0 3px rgba(239,68,68,.15)}
.ta{height:136px;padding:13px 15px;line-height:1.5;resize:none}
.err{font-size:13px;font-weight:700;color:#FF9C9C;line-height:1.35}
.card{background:linear-gradient(180deg,rgba(16,37,74,.92),rgba(12,29,59,.92));border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.18)}
.note{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:13px 14px;font-size:14px;line-height:1.5;font-weight:600}
.note svg{flex:none;margin-top:1px}
.note.info{background:rgba(57,123,255,.12);color:#CFE0FF;border:1px solid rgba(57,123,255,.28)}
.note.warn{background:rgba(245,158,11,.11);color:#FCD9A0;border:1px solid rgba(245,158,11,.3)}
.note.ok{background:rgba(34,197,94,.11);color:#B8F0CC;border:1px solid rgba(34,197,94,.3)}
.note.bad{background:rgba(239,68,68,.12);color:#FFC4C4;border:1px solid rgba(239,68,68,.32)}
.opt{position:relative;display:flex;align-items:center;gap:13px;min-height:58px;padding:13px 15px;border:1.5px solid var(--line);border-radius:16px;background:rgba(16,37,74,.7);cursor:pointer;transition:border-color .15s,background .15s,transform .1s;-webkit-tap-highlight-color:transparent}
.opt:active{transform:scale(.99)}
.opt.on{border-color:var(--accent);background:rgba(57,123,255,.15);box-shadow:0 0 0 1px rgba(57,123,255,.35) inset}
.opt.dim{opacity:.55}
.opt input{position:absolute;opacity:0;width:1px;height:1px;margin:0;pointer-events:none}
.opt:focus-within{box-shadow:0 0 0 3px rgba(57,123,255,.3)}
.check{flex:none;width:24px;height:24px;border-radius:8px;border:2px solid #4D6489;display:flex;align-items:center;justify-content:center;color:#fff;transition:all .15s}
.opt.on .check{background:var(--accent);border-color:var(--accent)}
.check svg{opacity:0;transition:opacity .15s}.opt.on .check svg{opacity:1}
.opt-t{font-weight:800;font-size:16px}
.opt-s{font-size:13px;font-weight:600;color:var(--text2)}
.hico{flex:none;width:42px;height:42px;border-radius:12px;background:rgba(57,123,255,.14);color:#8DB4FF;display:flex;align-items:center;justify-content:center}
.opt.on .hico{background:var(--accent);color:#fff}
.star{flex:none;height:34px;padding:0 10px;border-radius:999px;border:1.5px solid var(--line2);background:transparent;display:flex;align-items:center;gap:5px;font-size:12px;font-weight:800;color:var(--text2);cursor:pointer}
.star.on{background:rgba(245,158,11,.16);border-color:rgba(245,158,11,.6);color:#FCD34D}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:56px;border:0;border-radius:16px;font-size:16px;font-weight:800;cursor:pointer;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.985)}
.btn-p{background:linear-gradient(180deg,#4A88FF,var(--accent2));color:#fff;box-shadow:0 8px 22px rgba(57,123,255,.35)}
.btn-p:disabled{background:rgba(169,186,212,.14);color:#6F84A6;box-shadow:none;cursor:not-allowed}
.btn-g{background:rgba(169,186,212,.1);color:#DCE6F5;border:1px solid var(--line2)}
.btn-s{background:transparent;color:#8DB4FF;height:46px}
.btn-sm{height:42px;font-size:14px;border-radius:12px}
.iconbtn{flex:none;width:44px;height:44px;margin-left:-10px;border:0;background:transparent;border-radius:12px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.menu{display:flex;align-items:center;gap:14px;width:100%;min-height:74px;padding:14px 16px;border:1px solid var(--line);border-radius:18px;background:rgba(16,37,74,.8);text-align:left;cursor:pointer;transition:border-color .15s}
.menu:active{border-color:var(--accent)}
.ico{flex:none;width:44px;height:44px;border-radius:13px;background:rgba(57,123,255,.16);color:#8DB4FF;display:flex;align-items:center;justify-content:center}
.link{border:0;background:transparent;color:#8DB4FF;font-weight:800;font-size:14px;padding:10px 6px;margin-right:-6px;cursor:pointer;min-height:44px;border-radius:10px}
.k{font-size:13px;color:var(--text3);font-weight:700}
.v{font-size:15px;font-weight:600;line-height:1.45;white-space:pre-line;word-break:break-word}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 11px;border-radius:999px;font-size:13px;font-weight:800;background:rgba(169,186,212,.12);color:var(--text2);white-space:nowrap}
.chip.on{background:rgba(57,123,255,.2);color:#CFE0FF}
.chip.ok{background:rgba(34,197,94,.16);color:#86EFAC}
.chip.warn{background:rgba(245,158,11,.16);color:#FCD34D}
.chip.bad{background:rgba(239,68,68,.16);color:#FCA5A5}
.chipbtn{height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line2);background:transparent;font-size:13px;font-weight:800;color:#DCE6F5;cursor:pointer}
.chipbtn.on{border-color:var(--accent);background:rgba(57,123,255,.18)}
.logo{width:46px;height:46px;border-radius:14px;background:linear-gradient(135deg,#4A88FF,#1C4FC4);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:0 8px 20px rgba(57,123,255,.35)}
.brand{font-weight:800;font-size:16px;letter-spacing:.08em}
.brand b{color:var(--accent);font-weight:800}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:30px 12px 0}
.spin{width:38px;height:38px;border-radius:50%;border:3px solid rgba(169,186,212,.2);border-top-color:var(--accent);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* языки */
.lang{border:1.5px solid var(--line);border-radius:16px;background:rgba(16,37,74,.7);overflow:hidden;transition:border-color .15s}
.lang.on{border-color:var(--accent);background:rgba(57,123,255,.1)}
.lang .opt{border:0;background:transparent;border-radius:0;min-height:52px;padding:12px 15px}
.lang .opt.on{box-shadow:none;background:transparent}
.levels{display:flex;gap:6px;padding:0 15px 13px;flex-wrap:wrap}
.lvl{height:34px;padding:0 12px;border-radius:999px;border:1.5px solid var(--line2);background:transparent;font-size:13px;font-weight:700;color:var(--text2);cursor:pointer}
.lvl.on{border-color:var(--accent);background:var(--accent);color:#fff}
.langgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.langgrid .full{grid-column:1/-1}
/* смены */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.stat{background:rgba(16,37,74,.8);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center}
.stat b{display:block;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{display:block;font-size:11px;font-weight:700;color:var(--text2);margin-top:2px}
.day{background:rgba(16,37,74,.75);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.day.on{border-color:rgba(57,123,255,.55)}
.day-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 2px}
.day-t{font-weight:800;font-size:16px}
.day-w{font-size:13px;font-weight:700;color:var(--text2)}
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.sh{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:60px;border-radius:13px;border:1.5px solid var(--line2);background:rgba(5,15,34,.45);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:all .15s}
.sh input{position:absolute;opacity:0;width:1px;height:1px;pointer-events:none}
.sh .n{font-size:13px;font-weight:800}
.sh .t{font-size:12px;font-weight:700;color:var(--text2);font-variant-numeric:tabular-nums}
.sh.on{background:linear-gradient(180deg,#4A88FF,var(--accent2));border-color:transparent;box-shadow:0 6px 16px rgba(57,123,255,.35)}
.sh.on .t{color:#E3EDFF}
.sh:focus-within{box-shadow:0 0 0 3px rgba(57,123,255,.35)}
.plus1{position:absolute;top:4px;right:6px;font-size:10px;font-weight:800;color:#FCD34D}
.sh.on .plus1{color:#FFE7A3}
.legend{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.legend div{border-radius:12px;background:rgba(169,186,212,.07);padding:9px 8px;text-align:center}
.legend b{display:block;font-size:13px}
.legend span{display:block;font-size:11px;font-weight:700;color:var(--text2);line-height:1.35;margin-top:2px}
/* расписание */
.asg{border-left:3px solid var(--accent)}
.asg.cancel{border-left-color:var(--err);opacity:.75}
.asg.done{border-left-color:var(--ok)}
/* успех */
.okring{width:104px;height:104px;border-radius:50%;background:rgba(34,197,94,.12);display:flex;align-items:center;justify-content:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) both}
.okring div{width:76px;height:76px;border-radius:50%;background:var(--ok);display:flex;align-items:center;justify-content:center;box-shadow:0 10px 30px rgba(34,197,94,.4)}
.okring path{stroke-dasharray:30;stroke-dashoffset:30;animation:draw .45s .35s ease forwards}
@keyframes pop{from{transform:scale(.4);opacity:0}to{transform:none;opacity:1}}
@keyframes draw{to{stroke-dashoffset:0}}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:5;animation:in .25s ease both;background:#0F2E25 !important;box-shadow:0 12px 30px rgba(0,0,0,.45)}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =====================================================================
   НАСТРОЙКИ — меняются только здесь
   ===================================================================== */
const CONFIG = {
  // Production URL вебхука из n8n (узел «Webhook (мини-приложение)», вкладка Production URL)
  API_URL: 'https://tanggsuuuu.app.n8n.cloud/webhook/hotel-api',
  // Год чемпионата: даты 24 октября — 1 ноября строятся от него
  YEAR: 2026,
  // true — анкету можно пройти в обычном браузере без сохранения (для проверки дизайна).
  // То же самое включается добавлением ?demo=1 к адресу страницы.
  DEV_MODE: false
};

/* ---------- справочники (порядок отелей менять нельзя) ---------- */
const HOTELS = [
  { id: 'radisson',      name: 'Radisson',                address: 'Сарыарка 4' },
  { id: 'park_inn',      name: 'Park Inn',                address: 'Сарыарка 8а' },
  { id: 'hgi',           name: 'Hilton Garden Inn (ХГИ)', address: 'Кабанбай батыр 15' },
  { id: 'saad',          name: 'SAAD',                    address: 'Достык 2' },
  { id: 'holiday_inn',   name: 'Holiday Inn',             address: 'Туран 44' },
  { id: 'hampton',       name: 'Hampton',                 address: 'Мангилик ел 43а' },
  { id: 'hilton_astana', name: 'Hilton Astana',           address: 'Гейдар Алиева 14' },
  { id: 'wyndham',       name: 'Wyndham',                 address: 'Хусейн бен Талал 25' },
  { id: 'mirotel',       name: 'мирОтель',                address: 'Аркат 1' },
  { id: 'kazzhol',       name: 'Kazzhol',                 address: 'Балкантау 213' },
  { id: 'ibis',          name: 'Ibis',                    address: 'Тауелсиздик 38' },
  { id: 'alanda',        name: 'Alanda',                  address: 'Тауелсиздик 33' }
];
const LANGS = [
  { id: 'kk', name: 'Казахский' }, { id: 'ru', name: 'Русский' }, { id: 'en', name: 'Английский' },
  { id: 'tr', name: 'Турецкий' },  { id: 'zh', name: 'Китайский' }, { id: 'fr', name: 'Французский' },
  { id: 'de', name: 'Немецкий' },  { id: 'es', name: 'Испанский' }, { id: 'ar', name: 'Арабский' },
  { id: 'other', name: 'Другой' }
];
const LEVELS = [ { id: 'basic', name: 'Базовый' }, { id: 'conv', name: 'Разговорный' }, { id: 'fluent', name: 'Свободный' } ];
const SHIFTS = [
  { id: 'm', name: 'Утро',  from: '07:00', to: '15:00', short: '07–15' },
  { id: 'e', name: 'Вечер', from: '15:00', to: '23:00', short: '15–23' },
  { id: 'n', name: 'Ночь',  from: '23:00', to: '07:00', short: '23–07', nextDay: true }
];
const MONTHS = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const WDS = ['вс','пн','вт','ср','чт','пт','сб'];
function buildDays(year) {
  const out = []; const start = Date.UTC(year, 9, 24);
  for (let i = 0; i < 9; i++) {
    const d = new Date(start + i * 864e5);
    const iso = d.toISOString().slice(0, 10);
    out.push({ date: iso, day: d.getUTCDate(), label: d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()], wd: WD[d.getUTCDay()], wds: WDS[d.getUTCDay()] });
  }
  return out;
}
const params = new URLSearchParams(location.search);
const DEMO = CONFIG.DEV_MODE || params.get('demo') === '1';
const DAYS = buildDays(CONFIG.YEAR);
const nextDayLabel = iso => { const i = DAYS.findIndex(d => d.date === iso); if (i >= 0 && i < DAYS.length - 1) return DAYS[i + 1].label; const d = new Date(Date.parse(iso) + 864e5); return d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; };
const STATUS_TONE = { 'Ожидает распределения': 'on', 'Назначен': 'ok', 'Подтверждён': 'ok', 'Резерв': 'warn', 'Не участвует': 'bad' };

/* =====================================================================
   Telegram и API
   ===================================================================== */
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor('#07152E'); tg.setBackgroundColor('#07152E'); if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {} }
const haptic = t => { try { tg && tg.HapticFeedback && (t === 'ok' ? tg.HapticFeedback.notificationOccurred('success') : tg.HapticFeedback.selectionChanged()); } catch (e) {} };

async function api(action, data) {
  const initData = (tg && tg.initData) || '';
  if (!initData) {
    if (DEMO) return mockApi(action, data);
    throw new Error('no_telegram');
  }
  const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 25000);
  try {
    const res = await fetch(CONFIG.API_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, signal: ctrl.signal,
      body: JSON.stringify({ action, initData, data: data || {} })
    });
    if (!res.ok) throw new Error('http_' + res.status);
    const j = await res.json();
    if (!j || !j.ok) { const e = new Error((j && j.error) || 'server'); e.details = j && j.details; throw e; }
    return j;
  } finally { clearTimeout(timer); }
}
/* демо-режим: имитирует ответы сервера без сохранения */
let mock = null;
async function mockApi(action, data) {
  await new Promise(r => setTimeout(r, 450));
  const settings = { age_min: '', age_max: '', edit_open: true, edit_deadline: '', coordinator: { name: 'Координатор HOTEL (демо)', telegram: 'arena_hotel_demo', phone: '+7 700 000 00 00' } };
  if (action === 'get') return { ok: true, volunteer: mock && mock.volunteer, assignments: mock ? mock.assignments : [], settings };
  if (action === 'save') {
    const isNew = !mock;
    mock = mock || { assignments: [] };
    mock.volunteer = Object.assign({}, data, { status: isNew ? 'Ожидает распределения' : mock.volunteer.status, updated: new Date().toLocaleString('ru-RU') });
    if (isNew && params.get('demoassign') === '1') {
      const firstShift = (data.shifts || [])[0] || (DAYS[2].date + '_m');
      const [d, s] = firstShift.split('_');
      mock.assignments = [{ row: 2, hotel_id: (data.hotel_ids || [])[0] || 'radisson', date: d, shift: s, status: 'Назначен', comment: 'Встреча у стойки регистрации за 15 минут до начала.' }];
    }
    return { ok: true, volunteer: mock.volunteer, assignments: mock.assignments, settings };
  }
  if (action === 'confirm') { mock.assignments.forEach(a => { if (a.row === data.row) a.status = 'Подтверждено'; }); return { ok: true, assignments: mock.assignments, settings }; }
  return { ok: false, error: 'unknown' };
}

/* =====================================================================
   Состояние
   ===================================================================== */
const blank = () => ({ full_name: '', phone: '', age: '', langs: {}, other_lang: '', hotel_ids: [], preferred: '', any_hotel: false, shifts: {}, notes: '', consent: false });
const S = { screen: 'loading', form: blank(), draft: null, tried: {}, registered: false, meta: {}, assignments: [], settings: {}, saving: false, fromReview: false, toast: '', error: '', saveError: '', anim: true };

const EDIT_SCREENS = ['editPersonal', 'editHotels', 'editAvail'];
const isEdit = () => EDIT_SCREENS.includes(S.screen);
const cur = () => isEdit() ? S.draft : S.form;
const clone = o => JSON.parse(JSON.stringify(o));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const hotelById = id => HOTELS.find(h => h.id === id);
const dayByIso = iso => DAYS.find(d => d.date === iso);
const shiftById = id => SHIFTS.find(s => s.id === id);

/* ---------- телефон: +7 (XXX) XXX-XX-XX ---------- */
function fmtPhone(v) {
  let d = String(v || '').replace(/\D/g, '');
  if (!d) return '';
  if (d[0] === '8') d = '7' + d.slice(1);
  if (d[0] !== '7') d = '7' + d;
  d = d.slice(0, 11);
  let o = '+7';
  if (d.length > 1) o += ' (' + d.slice(1, 4);
  if (d.length >= 4) o += ')';
  if (d.length > 4) o += ' ' + d.slice(4, 7);
  if (d.length > 7) o += '-' + d.slice(7, 9);
  if (d.length > 9) o += '-' + d.slice(9, 11);
  return o;
}

/* ---------- подсчёты по сменам ---------- */
function shiftStats(sh) {
  const keys = Object.keys(sh || {}).filter(k => sh[k]);
  const days = new Set(keys.map(k => k.split('_')[0]));
  const c = { m: 0, e: 0, n: 0 }; keys.forEach(k => { c[k.split('_')[1]]++; });
  return { shifts: keys.length, days: days.size, m: c.m, e: c.e, n: c.n };
}
// предупреждения об отдыхе: две смены подряд = 16 часов без перерыва
function restWarnings(sh) {
  const out = [];
  DAYS.forEach((d, i) => {
    const on = id => !!sh[d.date + '_' + id];
    if (on('m') && on('e')) out.push(d.label + ': утро и вечер подряд — 16 часов без перерыва');
    if (on('e') && on('n')) out.push(d.label + ': вечер и ночь подряд — 16 часов без перерыва');
    const nx = DAYS[i + 1];
    if (nx && on('n') && sh[nx.date + '_m']) out.push(d.label + ' ночь и ' + nx.label + ' утро подряд — 16 часов без перерыва');
  });
  return out;
}

/* ---------- валидация ---------- */
function ageLimits() {
  const mn = parseInt(S.settings.age_min, 10), mx = parseInt(S.settings.age_max, 10);
  return { min: isNaN(mn) ? 10 : mn, max: isNaN(mx) ? 99 : mx, custom: !isNaN(mn) || !isNaN(mx) };
}
function validatePersonal(f) {
  const e = {};
  const name = f.full_name.trim();
  if (!name) e.full_name = 'Укажите ФИО';
  else if (name.split(/\s+/).length < 2) e.full_name = 'Укажите фамилию и имя полностью';
  const pd = f.phone.replace(/\D/g, '');
  if (!pd || pd === '7') e.phone = 'Укажите номер телефона';
  else if (pd.length < 11) e.phone = 'Номер неполный. Пример: +7 (701) 234-56-78';
  else if (!/^7[0-9]{10}$/.test(pd)) e.phone = 'Проверьте номер';
  const a = String(f.age).trim();
  const L = ageLimits();
  if (!a) e.age = 'Укажите возраст';
  else if (!/^\d{1,2}$/.test(a)) e.age = 'Возраст — число';
  else if (+a < L.min || +a > L.max) e.age = L.custom ? `Возраст участника: от ${L.min} до ${L.max} лет` : 'Проверьте возраст';
  const ids = Object.keys(f.langs);
  if (!ids.length) e.langs = 'Отметьте хотя бы один язык';
  else if (f.langs.other !== undefined && !f.other_lang.trim()) e.langs = 'Напишите, какой «другой» язык';
  return e;
}
const hotelsOk = f => f.any_hotel || f.hotel_ids.length > 0;
const shiftsOk = f => shiftStats(f.shifts).shifts > 0;

/* ---------- сервер ↔ форма ---------- */
function fromServer(v) {
  const f = blank();
  if (!v) return f;
  f.full_name = v.full_name || ''; f.phone = fmtPhone(v.phone); f.age = v.age ? String(v.age) : '';
  (v.languages || []).forEach(l => { f.langs[l.id] = l.level || ''; });
  f.other_lang = v.other_lang || '';
  f.hotel_ids = HOTELS.filter(h => (v.hotel_ids || []).includes(h.id)).map(h => h.id);
  f.preferred = v.preferred || ''; f.any_hotel = !!v.any_hotel;
  (v.shifts || []).forEach(k => { f.shifts[k] = true; });
  f.notes = v.notes || ''; f.consent = !!v.consent;
  return f;
}
function toPayload(f) {
  return {
    full_name: f.full_name.trim().replace(/\s+/g, ' '), phone: f.phone, age: parseInt(f.age, 10),
    languages: LANGS.filter(l => f.langs[l.id] !== undefined).map(l => ({ id: l.id, level: f.langs[l.id] || '' })),
    other_lang: f.langs.other !== undefined ? f.other_lang.trim() : '',
    hotel_ids: HOTELS.filter(h => f.hotel_ids.includes(h.id)).map(h => h.id),
    preferred: f.preferred, any_hotel: !!f.any_hotel,
    shifts: DAYS.flatMap(d => SHIFTS.map(s => d.date + '_' + s.id)).filter(k => f.shifts[k]),
    notes: f.notes.trim(), consent: !!f.consent
  };
}
function applyServer(r) {
  if (r.settings) S.settings = r.settings;
  if (r.assignments) S.assignments = r.assignments;
  if (r.volunteer) { S.meta = { status: r.volunteer.status || 'Ожидает распределения', updated: r.volunteer.updated || '' }; }
}

/* =====================================================================
   Действия
   ===================================================================== */
function go(screen, extra) { Object.assign(S, { screen, anim: true }, extra || {}); render(true); }
function setField(k, v, rerender) { cur()[k] = v; if (rerender) render(false); }
function showToast(t) { S.toast = t; render(false); clearTimeout(showToast.t); showToast.t = setTimeout(() => { S.toast = ''; render(false); }, 3200); }

async function load() {
  S.screen = 'loading'; render(true);
  try {
    const r = await api('get');
    applyServer(r);
    if (r.volunteer) { S.registered = true; S.form = fromServer(r.volunteer); S.screen = 'home'; }
    else S.screen = 'welcome';
  } catch (e) { S.error = e.message === 'no_telegram' ? 'no_telegram' : 'load'; S.screen = 'error'; }
  S.anim = true; render(true);
}
const ORDER = ['personal', 'hotels', 'availability', 'review'];
function next() {
  const f = S.form, sc = S.screen;
  if (sc === 'personal' && Object.keys(validatePersonal(f)).length) { S.tried.personal = true; render(true); return; }
  if (sc === 'hotels' && !hotelsOk(f)) return;
  if (sc === 'availability' && !shiftsOk(f)) return;
  haptic();
  if (S.fromReview) { go('review', { fromReview: false }); return; }
  go(ORDER[ORDER.indexOf(sc) + 1]);
}
function back() {
  const sc = S.screen;
  if (S.fromReview && ORDER.includes(sc) && sc !== 'review') { go('review', { fromReview: false }); return; }
  const map = { personal: 'welcome', hotels: 'personal', availability: 'hotels', review: 'availability' };
  go(map[sc] || 'home', { draft: null, tried: {} });
}
function errText(e) {
  if (e.message === 'deadline') return 'Срок редактирования анкеты истёк. Напишите координатору.';
  if (e.message === 'validation') return 'Сервер не принял данные: ' + (e.details || 'проверьте поля') + '.';
  if (e.message === 'auth') return 'Не удалось подтвердить вход через Telegram. Закройте и снова откройте приложение из бота.';
  return 'Не удалось отправить. Проверьте интернет и попробуйте ещё раз.';
}
async function submit() {
  if (S.saving) return;                       // защита от двойного нажатия
  if (!S.form.consent) { S.tried.consent = true; render(false); return; }
  S.saving = true; S.saveError = ''; render(false);
  try {
    const r = await api('save', toPayload(S.form));
    applyServer(r); if (r.volunteer) S.form = fromServer(r.volunteer);
    S.registered = true; S.saving = false; haptic('ok'); go('success', { fromReview: false });
  } catch (e) { S.saving = false; S.saveError = errText(e); render(false); }
}
function openEdit(screen) {
  if (S.settings.edit_open === false) { showToast('Срок редактирования анкеты истёк — напишите координатору'); return; }
  go(screen, { draft: clone(S.form), tried: {}, saveError: '' });
}
async function saveEdit() {
  if (S.saving) return;
  const d = S.draft, sc = S.screen;
  if (sc === 'editPersonal' && Object.keys(validatePersonal(d)).length) { S.tried.edit = true; render(true); return; }
  if (sc === 'editHotels' && !hotelsOk(d)) return;
  if (sc === 'editAvail' && !shiftsOk(d)) return;
  S.saving = true; S.saveError = ''; render(false);
  try {
    const r = await api('save', toPayload(d));
    applyServer(r); S.form = r.volunteer ? fromServer(r.volunteer) : d;
    S.saving = false; haptic('ok');
    const active = S.assignments.some(a => a.status !== 'Отменено');
    go('home', { draft: null, tried: {} });
    showToast(active ? 'Данные обновлены. Координатор получит уведомление об изменениях.' : 'Данные обновлены');
  } catch (e) { S.saving = false; S.saveError = errText(e); render(false); }
}
async function confirmShift(row) {
  if (S.saving) return;
  S.saving = true; render(false);
  try { const r = await api('confirm', { row }); applyServer(r); S.saving = false; haptic('ok'); showToast('Смена подтверждена. Спасибо!'); }
  catch (e) { S.saving = false; showToast('Не удалось подтвердить. Попробуйте ещё раз.'); }
}
function contact() {
  const t = (S.settings.coordinator || {}).telegram;
  if (!t) return;
  const url = 'https://t.me/' + t.replace(/^@/, '');
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else window.open(url, '_blank');
}
function toggleShift(key) { const d = Object.assign({}, cur().shifts); if (d[key]) delete d[key]; else d[key] = true; haptic(); setField('shifts', d, true); }
function bulkShift(id) {
  const d = Object.assign({}, cur().shifts);
  if (id === 'reset') { setField('shifts', {}, true); return; }
  if (id === 'all') { DAYS.forEach(x => SHIFTS.forEach(s => { d[x.date + '_' + s.id] = true; })); setField('shifts', d, true); return; }
  const allOn = DAYS.every(x => d[x.date + '_' + id]);
  DAYS.forEach(x => { if (allOn) delete d[x.date + '_' + id]; else d[x.date + '_' + id] = true; });
  setField('shifts', d, true);
}

function field(id, key, label, attrs, errs, tried, hint) {
  const f = cur(); const bad = tried && errs[key];
  return `<div class="col g6"><label for="${id}" class="lbl">${label} <span class="req">*</span></label>
    <input id="${id}" class="inp${bad ? ' bad' : ''}" data-field="${key}" value="${esc(f[key])}" ${attrs}>
    ${bad ? `<div class="err">${esc(errs[key])}</div>` : hint ? `<div class="muted small">${hint}</div>` : ''}</div>`;
}

    <div class="card col g10">
      <div class="row between" style="align-items:baseline;gap:8px"><label for="f-notes" class="h2" style="font-size:16px">Есть особые обстоятельства?</label><span class="muted" style="font-size:12px;font-weight:700">необязательно</span></div>
      <p class="muted small" style="margin:0;font-size:14px">Если в определённый день вам нужно отлучиться, прийти позже или уйти раньше, пожалуйста, укажите это заранее: дату, время и причину.</p>
      <textarea id="f-notes" class="inp ta" data-field="notes" maxlength="1500" placeholder="Например:&#10;26 октября — экзамен с 11:00 до 14:00, после смогу вернуться.&#10;28 октября смогу прийти только к 10:00.">${esc(f.notes)}</textarea>
    </div>`;
}

function langText(f) {
  return LANGS.filter(l => f.langs[l.id] !== undefined).map(l => {
    const nm = l.id === 'other' ? (f.other_lang.trim() || 'Другой') : l.name; const lv = LEVELS.find(v => v.id === f.langs[l.id]);
    return nm + (lv ? ' — ' + lv.name.toLowerCase() : '');
  }).join('\n') || '—';
}
function hotelsText(f) {
  if (f.any_hotel) return 'Любой из 12 отелей';
  const others = HOTELS.filter(h => f.hotel_ids.includes(h.id) && h.id !== f.preferred).map(h => h.name);
  return others.join(', ') || '—';
}
function shiftsText(f) {
  return DAYS.map(d => { const ss = SHIFTS.filter(s => f.shifts[d.date + '_' + s.id]); return ss.length ? `${d.label}: ${ss.map(s => s.name.toLowerCase() + ' ' + s.from + '–' + s.to).join(', ')}` : ''; }).filter(Boolean).join('\n') || '—';
}
function shiftLine(a) {
  const s = shiftById(a.shift); if (!s) return '';
  return s.nextDay ? `${s.from} — ${s.to} (${nextDayLabel(a.date)})` : `${s.from} — ${s.to}`;
}
function assignCard(a) {
  const h = hotelById(a.hotel_id) || { name: a.hotel || '—', address: '' }; const d = dayByIso(a.date); const s = shiftById(a.shift);
  const tone = a.status === 'Отменено' ? 'bad' : a.status === 'Назначен' ? 'warn' : 'ok';
  return `<div class="card asg${a.status === 'Отменено' ? ' cancel' : a.status === 'Отработал(а)' ? ' done' : ''} col g10">
    <div class="row between g8"><span class="opt-t">${esc(h.name)}</span><span class="chip ${tone}">${esc(a.status === 'Назначен' ? 'Ждёт подтверждения' : a.status)}</span></div>
    ${h.address ? `<div class="opt-s row g4">${I.pin}${esc(h.address)}</div>` : ''}
    <div class="row g16 wrap"><div class="col g4"><span class="k">Дата</span><span class="v">${d ? d.label + ', ' + d.wds : esc(a.date)}</span></div>
      <div class="col g4"><span class="k">Смена${s ? ' · ' + s.name.toLowerCase() : ''}</span><span class="v">${esc(shiftLine(a))}</span></div></div>
    ${a.comment ? `<div class="note info" style="padding:10px 12px">${I.info}<span>${esc(a.comment)}</span></div>` : ''}
    ${a.status === 'Назначен' ? `<button class="btn btn-p btn-sm" data-confirm="${a.row}" ${S.saving ? 'disabled' : ''}>Подтверждаю смену</button>` : ''}
  </div>`;
}

    }
  }
  return '';
}
const saveErr = () => S.saveError ? `<div class="note bad" role="alert">${I.alert}<span>${esc(S.saveError)}</span></div>` : '';

function footer() {
  const sc = S.screen, f = cur(), step = STEP[sc];
  const btn = (label, act, disabled) => `<button class="btn btn-p" data-act="${act}" ${disabled ? 'disabled' : ''}>${label}</button>`;
  const hint = t => `<div class="muted small" style="text-align:center">${t}</div>`;
  if (sc === 'welcome') return btn('Начать регистрацию →', 'start');
  if (step && step <= 3) {
    let h = '';
    if (sc === 'hotels' && !hotelsOk(f)) h = 'Выберите хотя бы один отель или «Мне подходит любой отель»';
    if (sc === 'availability' && !shiftsOk(f)) h = 'Отметьте хотя бы одну смену';
    const main = btn(S.fromReview ? 'Сохранить и вернуться' : 'Продолжить →', 'next', !!h);
    return (h ? hint(h) : '') + (step > 1 && !S.fromReview ? `<div class="ftr-row"><button class="btn btn-g" style="width:42%" data-act="back">← Назад</button>${main}</div>` : main);
  }
  if (sc === 'review') return btn(S.saving ? 'Отправляем…' : 'Подтвердить регистрацию', 'submit', S.saving);
  if (sc === 'success') return btn('Перейти в личный кабинет', 'home');
  if (isEdit()) {
    const dirty = JSON.stringify(S.draft) !== JSON.stringify(S.form);
    let h = '';
    if (sc === 'editHotels' && !hotelsOk(f)) h = 'Выберите хотя бы один отель';
    if (sc === 'editAvail' && !shiftsOk(f)) h = 'Отметьте хотя бы одну смену';
    return (h ? hint(h) : '') + btn(S.saving ? 'Сохраняем…' : 'Сохранить изменения', 'saveEdit', S.saving || !dirty || !!h);
  }
  if (sc === 'contact' && (S.settings.coordinator || {}).telegram) return btn('Написать координатору', 'write');
  if (sc === 'error') return btn('Попробовать снова', 'reload');
  return '';
}

function render(scrollTop) {
  const sc = S.screen, step = STEP[sc] || 0, it = INTRO[sc];
  const old = document.querySelector('main');
  const keep = old && !scrollTop ? old.scrollTop : 0;
  const showHdr = !['welcome', 'home', 'success', 'loading', 'error'].includes(sc);
  const e = sc === 'personal' ? validatePersonal(S.form) : sc === 'editPersonal' ? validatePersonal(S.draft) : {};
  const tried = sc === 'personal' ? S.tried.personal : sc === 'editPersonal' ? S.tried.edit : false;
  const errBanner = tried && Object.keys(e).length;
  const ft = footer();
  document.getElementById('app').innerHTML =
    (showHdr ? `<header class="hdr"><div class="hdr-row"><button class="iconbtn" data-act="back" aria-label="Назад">${I.back}</button>
      <div class="hdr-title">${step ? 'Регистрация' : 'Личный кабинет'}</div>${step ? `<div class="step">Шаг ${step} из 4</div>` : ''}</div>
      ${step ? `<div class="segs" aria-hidden="true">${[1, 2, 3, 4].map(i => `<div class="seg${i <= step ? ' on' : ''}"><i></i></div>`).join('')}</div>` : ''}</header>` : '') +
    `<main class="${S.anim ? 'anim' : ''}">${it ? `<div><h1>${it[0]}</h1>${it[1] ? `<p class="sub">${it[1]}</p>` : ''}</div>` : ''}
      ${errBanner ? `<div class="note bad" role="alert">${I.alert}<span>Проверьте отмеченные поля — они обязательны.</span></div>` : ''}
      ${screenBody()}</main>` +
    (ft ? `<footer class="ftr">${ft}</footer>` : '') +
    (S.toast ? `<div class="toast note ok" role="status">${I.tick(18, 2.6)}<span>${esc(S.toast)}</span></div>` : '');
  document.querySelector('main').scrollTop = keep;
  S.anim = false;
}

/* ---------- события ---------- */
const app = document.getElementById('app');
app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-act],[data-level],[data-pref],[data-bulk],[data-confirm]'); if (!b || b.disabled) return;
  if (b.dataset.level) { const [id, lv] = b.dataset.level.split(':'); const L = Object.assign({}, cur().langs); L[id] = L[id] === lv ? '' : lv; setField('langs', L, true); return; }
  if (b.dataset.pref) { ev.preventDefault(); const id = b.dataset.pref; setField('preferred', cur().preferred === id ? '' : id, true); haptic(); return; }
  if (b.dataset.bulk) { bulkShift(b.dataset.bulk); return; }
  if (b.dataset.confirm) { confirmShift(+b.dataset.confirm); return; }
  const a = b.dataset.act;
  if (a === 'start') go('personal', { tried: {} });
  else if (a === 'next') next();
  else if (a === 'back') back();
  else if (a === 'submit') submit();
  else if (a === 'home') go('home');
  else if (a === 'fixPersonal') go('personal', { fromReview: true });
  else if (a === 'fixHotels') go('hotels', { fromReview: true });
  else if (a === 'fixAvail') go('availability', { fromReview: true });
  else if (EDIT_SCREENS.includes(a)) openEdit(a);
  else if (a === 'saveEdit') saveEdit();
  else if (a === 'schedule' || a === 'contact') go(a);
  else if (a === 'write') contact();
  else if (a === 'reload') load();
});
app.addEventListener('input', ev => {
  const t = ev.target;
  if (t.dataset.field) {
    let v = t.value;
    if (t.dataset.mask === 'phone') { v = fmtPhone(v); t.value = v; }
    if (t.dataset.mask === 'age') { v = v.replace(/\D/g, '').slice(0, 2); t.value = v; }
    setField(t.dataset.field, v, false);
    refreshFooter();
  }
});
app.addEventListener('change', ev => {
  const t = ev.target;
  if (t.dataset.lang) { const L = Object.assign({}, cur().langs); if (L[t.dataset.lang] !== undefined) delete L[t.dataset.lang]; else L[t.dataset.lang] = ''; haptic(); setField('langs', L, true); }
  else if (t.dataset.hotel) {
    const id = t.dataset.hotel; const arr = cur().hotel_ids.slice(); const i = arr.indexOf(id);
    if (i >= 0) { arr.splice(i, 1); if (cur().preferred === id) cur().preferred = ''; } else arr.push(id);
    haptic(); setField('hotel_ids', HOTELS.filter(h => arr.includes(h.id)).map(h => h.id), true);
  }
  else if (t.dataset.shift) toggleShift(t.dataset.shift);
  else if (t.dataset.toggle) {
    const k = t.dataset.toggle; const v = !cur()[k]; cur()[k] = v;
    if (k === 'any_hotel' && !v && cur().preferred && !cur().hotel_ids.includes(cur().preferred)) cur().hotel_ids.push(cur().preferred);
    haptic(); render(false);
  }
});
// при наборе текста обновляем только нижнюю панель, не трогая поле с курсором
function refreshFooter() { const f = document.querySelector('.ftr'); if (f) f.innerHTML = footer(); }
if (tg && tg.BackButton) { tg.BackButton.onClick(() => { if (['welcome', 'home', 'loading', 'error'].includes(S.screen)) tg.close(); else if (S.screen === 'success') go('home'); else back(); }); }
const _render = render;
render = function (st) { _render(st); try { if (tg && tg.BackButton) { if (['welcome', 'home', 'loading', 'error'].includes(S.screen)) tg.BackButton.hide(); else tg.BackButton.show(); } } catch (e) {} };

load();
</script>
